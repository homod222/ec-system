openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the nursery management platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: phone-auth
    description: Passwordless Kuwait phone authentication
  - name: health
    description: Health operations
  - name: dashboard
    description: Nursery overview and activity
  - name: children
    description: Child records
  - name: guardians
    description: Guardian records
  - name: classrooms
    description: Classroom records
  - name: staff
    description: Staff records
  - name: attendance
    description: Attendance records
  - name: finance
    description: Fees, invoices, and payments
  - name: applications
    description: Nursery registration and renewal applications
  - name: storage
    description: Private application document storage
  - name: parent
    description: Guardian-scoped parent portal
  - name: operations
    description: Owner-scoped nursery operational records
  - name: reports
    description: Operational, academic, and financial reporting
  - name: permissions
    description: Role permissions and security audit
  - name: site-gallery
    description: Public website gallery management
paths:
  /auth/phone/request:
    post:
      operationId: requestPhoneLogin
      tags: [phone-auth]
      summary: Request a WhatsApp login code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneLoginRequest" }
      responses:
        "200":
          description: Generic accepted response, with first name only when uniquely recognized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneLoginChallenge" }
        "429": { description: Too many requests }
  /auth/phone/verify:
    post:
      operationId: verifyPhoneLogin
      tags: [phone-auth]
      summary: Verify code and issue a short-lived Clerk sign-in ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneLoginVerify" }
      responses:
        "200":
          description: Clerk one-time sign-in ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneLoginTicket" }
        "400": { description: "Invalid, expired, used, or locked challenge" }
        "429": { description: Too many attempts }
  /auth/phone/enrollment:
    get:
      operationId: getPhoneEnrollment
      tags: [phone-auth]
      summary: Get the authenticated owner's verified login phone
      responses:
        "200":
          description: Enrollment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneEnrollmentState" }
        "401": { description: Authentication required }
        "403": { description: Owner access required }
  /auth/phone/enrollment/request:
    post:
      operationId: requestPhoneEnrollment
      tags: [phone-auth]
      summary: Send a verification code before changing an owner's login phone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneLoginRequest" }
      responses:
        "200":
          description: Enrollment challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneLoginChallenge" }
        "403": { description: Owner access required }
        "409": { description: Phone already enrolled }
  /auth/phone/enrollment/verify:
    post:
      operationId: verifyPhoneEnrollment
      tags: [phone-auth]
      summary: Verify and atomically enroll an owner's login phone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneLoginVerify" }
      responses:
        "200":
          description: Verified enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneEnrollmentState" }
        "400": { description: Invalid challenge }
        "403": { description: Owner access required }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Summary of the nursery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List children
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: classroomId
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Child records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Child"
    post:
      operationId: createChild
      tags: [children]
      summary: Add a child
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "201":
          description: Created child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          description: Invalid child data
        "404":
          description: Classroom not found
        "409":
          description: Classroom is full
  /children/{id}:
    get:
      operationId: getChild
      tags: [children]
      summary: Get a child
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Child record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Child not found
    patch:
      operationId: updateChild
      tags: [children]
      summary: Update a child
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildUpdate"
      responses:
        "200":
          description: Updated child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Child or classroom not found
        "409":
          description: Classroom is full
    delete:
      operationId: deleteChild
      tags: [children]
      summary: Delete a child
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Child deleted
  /children/{id}/renewals:
    post:
      operationId: startChildRenewal
      tags: [applications]
      summary: Start a renewal application for a child
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Renewal application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Child not found
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List registration and renewal applications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, reviewing, accepted, rejected]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [new, renewal]
      responses:
        "200":
          description: Application records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create a registration application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid application data
        "404":
          description: Classroom not found
        "409":
          description: Classroom is full
  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application child and guardian data
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found
        "409":
          description: Accepted applications cannot be edited or classroom is full
  /applications/{id}/documents:
    post:
      operationId: attachApplicationDocument
      tags: [applications]
      summary: Attach uploaded document metadata to an application
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDocumentInput"
      responses:
        "201":
          description: Attached document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocument"
        "400":
          description: Invalid document metadata or object path
        "404":
          description: Application or uploaded object not found
        "409":
          description: Accepted applications cannot be edited
        "415":
          description: Unsupported document type
  /applications/{applicationId}/documents/{documentId}/content:
    get:
      operationId: getApplicationDocumentContent
      tags: [applications]
      summary: Download an application document
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: number
        - name: documentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Application document content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "404":
          description: Application document not found
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private object upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL and normalized object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          description: Unauthorized
        "400":
          description: Invalid upload metadata
        "404":
          description: Application not found
        "409":
          description: Accepted applications cannot be edited
        "415":
          description: Unsupported document type
  /applications/{id}/status:
    patch:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Move an application through review or reject it
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found
        "409":
          description: Illegal application status transition
  /applications/{id}/accept:
    post:
      operationId: acceptApplication
      tags: [applications]
      summary: Accept an application and activate its child record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Accepted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application or renewal child not found
        "409":
          description: Only reviewing applications can be accepted or classroom is full
  /guardians:
    get:
      operationId: listGuardians
      tags: [guardians]
      summary: List guardians
      responses:
        "200":
          description: Guardian records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guardian"
  /classrooms:
    get:
      operationId: listClassrooms
      tags: [classrooms]
      summary: List classrooms
      responses:
        "200":
          description: Classroom records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classroom"
    post:
      operationId: createClassroom
      tags: [classrooms]
      summary: Create a classroom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomInput"
      responses:
        "201":
          description: Created classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"
        "400":
          description: Invalid classroom data
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff
      responses:
        "200":
          description: Staff records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaff
      tags: [staff]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffInput" } } }
      responses:
        "201":
          description: Created staff member
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffMember" } } }
  /staff/{id}/account:
    post:
      operationId: startStaffAccount
      tags: [staff]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccountActionInput" } } }
      responses:
        "200":
          description: OTP sent or an existing Clerk user linked
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccountResult" } } }
        "400": { description: Invalid account action or missing email/phone }
        "403": { description: Owner access required }
        "404": { description: Staff member or Clerk user not found }
        "409": { description: Clerk user belongs to another nursery or staff record is already linked }
        "503": { description: WhatsApp delivery is unavailable }
    patch:
      operationId: updateStaffAccount
      tags: [staff]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccountUpdateInput" } } }
      responses:
        "200":
          description: Updated staff account
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccountResult" } } }
        "403": { description: Owner access required }
        "404": { description: Staff member or linked account not found }
        "409": { description: Account lifecycle conflict }
  /staff/{id}/account/verify:
    post:
      operationId: verifyStaffAccount
      tags: [staff]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccountVerifyInput" } } }
      responses:
        "200":
          description: Clerk account created after WhatsApp verification
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccountResult" } } }
        "400": { description: Invalid or expired OTP/password }
        "404": { description: Account verification not found }
        "409": { description: Verification is already being completed }
        "429": { description: Too many verification attempts }
  /staff/password-reset/request:
    post:
      operationId: requestStaffPasswordReset
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffPasswordResetRequest" } } }
      responses:
        "200":
          description: Generic acknowledgement regardless of account existence
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffPasswordResetRequestResult" } } }
        "429": { description: Too many requests }
  /staff/password-reset/complete:
    post:
      operationId: completeStaffPasswordReset
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffPasswordResetComplete" } } }
      responses:
        "200":
          description: Password updated
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffPasswordResetCompleteResult" } } }
        "400": { description: Invalid or expired reset link or password }
        "429": { description: Too many requests }
  /attendance/today:
    get:
      operationId: getTodayAttendance
      tags: [attendance]
      summary: Get today's child attendance
      responses:
        "200":
          description: Today's attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
  /attendance:
    post:
      operationId: recordAttendance
      tags: [attendance]
      summary: Record child attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Get finance summary
      responses:
        "200":
          description: Finance overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
  /invoices:
    get:
      operationId: listInvoices
      tags: [finance]
      summary: List recent invoices
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, issued, pending, partial, paid, overdue, cancelled]
      responses:
        "200":
          description: Invoice records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [finance]
      summary: Create a detailed internal invoice
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceInput" } } }
      responses:
        "201":
          description: Created invoice
          content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceDetail" } } }
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detailed invoice
          content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceDetail" } } }
  /invoices/{id}/payments:
    post:
      operationId: recordInvoicePayment
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InternalPaymentInput" } } }
      responses:
        "201":
          description: Payment and receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/Receipt" } } }
  /invoices/{id}/refunds:
    post:
      operationId: refundInvoicePayment
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefundInput" } } }
      responses:
        "201":
          description: Recorded refund
          content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceRefund" } } }
  /invoices/{id}/cancel:
    post:
      operationId: cancelInvoice
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CancelInvoiceInput" } } }
      responses:
        "200": { description: Cancelled invoice, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceDetail" } } } }
  /parent/documents:
    get:
      operationId: listParentDocuments
      tags: [parent]
      responses:
        "200":
          description: Parent-visible child documents
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ParentDocument" } } } }
  /parent/documents/{id}/content:
    get:
      operationId: getParentDocumentContent
      tags: [parent]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Private parent document content
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "404": { description: Document not found }
  /parent/receipts:
    get:
      operationId: listParentReceipts
      tags: [parent, finance]
      responses:
        "200":
          description: Guardian receipts
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Receipt" } } } }
  /invoices/{id}/checkout-session:
    post:
      operationId: createInvoiceCheckoutSession
      tags: [finance]
      summary: Create a MyFatoorah KNET payment for an invoice in KWD
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCheckoutSessionInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCheckoutSession"
        "400":
          description: Invoice already paid
        "404":
          description: Invoice not found
        "409":
          description: Invoice is not payable or an earlier payment attempt is still being reconciled
        "503":
          description: The MyFatoorah payment provider is not configured
  /invoices/{id}/cash-payment:
    post:
      operationId: recordCashInvoicePayment
      tags: [finance]
      summary: Record a full cash payment for an invoice
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashPaymentInput"
      responses:
        "200":
          description: Cash payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePaymentResult"
        "400":
          description: Invalid amount or invoice already paid
        "404":
          description: Invoice not found
        "409":
          description: Invoice was paid concurrently
  /invoices/{id}/reminder:
    post:
      operationId: sendInvoiceReminder
      tags: [finance]
      summary: Send a due-date payment reminder to the guardian
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Reminder dispatch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceReminderResult"
        "404":
          description: Invoice not found
  /billing-plans:
    get:
      operationId: listBillingPlans
      tags: [finance]
      summary: List owner-scoped installment billing plans
      responses:
        "200":
          description: Billing plans
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BillingPlan" } } } }
    post:
      operationId: createBillingPlan
      tags: [finance]
      summary: Create an installment plan and its schedule
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BillingPlanInput" } } }
      responses:
        "201":
          description: Created billing plan
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingPlan" } } }
        "400": { description: Invalid plan or schedule }
        "404": { description: Child not found }
  /billing-plans/{id}/status:
    patch:
      operationId: updateBillingPlanStatus
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BillingPlanStatusInput" } } }
      responses:
        "200":
          description: Updated plan
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingPlan" } } }
        "404": { description: Plan not found }
        "409": { description: Invalid status transition }
  /billing-plans/{id}/generate-next:
    post:
      operationId: generateNextBillingInstallment
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Next scheduled installment generated or already generated
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingPlanGenerationResult" } } }
        "404": { description: Plan or scheduled installment not found }
        "409": { description: Plan is not active }
  /parent/billing-plans:
    get:
      operationId: listParentBillingPlans
      tags: [parent, finance]
      summary: List installment plans belonging to the authenticated guardian

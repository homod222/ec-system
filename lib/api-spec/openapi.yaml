  /public/site-gallery/{id}/image:
    get:
      operationId: getPublicSiteGalleryImage
      tags: [site-gallery]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: Stream one published gallery image
      responses:
        "200":
          description: Gallery image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: Published image not found }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
    OptionalChildId:
      name: childId
      in: query
      required: false
      schema:
        type: number
    Resource:
      name: resource
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OperationalResource" }
  schemas:
    PhoneLoginRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone: { type: string, minLength: 8, maxLength: 30 }
    PhoneLoginVerify:
      type: object
      required: [challengeId, otp]
      additionalProperties: false
      properties:
        challengeId: { type: string, minLength: 32, maxLength: 64 }
        otp: { type: string, pattern: '^\d{6}$' }
    PhoneLoginChallenge:
      type: object
      required: [challengeId, expiresInSeconds, recognized]
      properties:
        challengeId: { type: string, minLength: 32, maxLength: 64 }
        expiresInSeconds: { type: integer, minimum: 1 }
        recognized: { type: boolean }
        firstName: { type: string, minLength: 1, maxLength: 100 }
    PhoneLoginTicket:
      type: object
      required: [ticket]
      properties:
        ticket: { type: string, minLength: 1 }
    PhoneEnrollmentState:
      type: object
      required: [enrolled]
      properties:
        enrolled: { type: boolean }
        phone: { type: string, pattern: '^965\d{8}$' }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      required: [totalChildren, presentToday, absentToday, staffCount, monthlyRevenue, pendingPayments, attendanceRate]
      properties:
        totalChildren: { type: number }
        presentToday: { type: number }
        absentToday: { type: number }
        staffCount: { type: number }
        monthlyRevenue: { type: number }
        pendingPayments: { type: number }
        attendanceRate: { type: number }
    Activity:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: number }
        type:
          type: string
          enum: [attendance, payment, enrollment, message, note]
        title: { type: string }
        description: { type: string }
        createdAt: { type: string }
        actor: { type: ["string", "null"] }
    Child:
      type: object
      required: [id, firstName, lastName, fullName, gender, birthDate, status, classroomId, classroomName, guardianName, guardianPhone, level, attendanceRate]
      properties:
        id: { type: number }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        gender:
          type: string
          enum: [male, female]
        birthDate: { type: string }
        status:
          type: string
          enum: [active, pending, inactive]
        classroomId: { type: ["number", "null"] }
        classroomName: { type: ["string", "null"] }
        guardianName: { type: string }
        guardianPhone: { type: string }
        level: { type: string }
        attendanceRate: { type: number }
        avatarUrl: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    ChildInput:
      type: object
      required: [firstName, lastName, gender, birthDate, guardianName, guardianPhone, level]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        gender:
          type: string
          enum: [male, female]
        birthDate: { type: string }

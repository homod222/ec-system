openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the nursery management platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Nursery overview and activity
  - name: children
    description: Child records
  - name: guardians
    description: Guardian records
  - name: classrooms
    description: Classroom records
  - name: staff
    description: Staff records
  - name: attendance
    description: Attendance records
  - name: finance
    description: Fees, invoices, and payments
  - name: applications
    description: Nursery registration and renewal applications
  - name: storage
    description: Private application document storage
  - name: parent
    description: Guardian-scoped parent portal
  - name: operations
    description: Owner-scoped nursery operational records
  - name: reports
    description: Operational, academic, and financial reporting
  - name: permissions
    description: Role permissions and security audit
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Summary of the nursery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List children
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: classroomId
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Child records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Child"
    post:
      operationId: createChild
      tags: [children]
      summary: Add a child
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "201":
          description: Created child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          description: Invalid child data
        "404":
          description: Classroom not found
        "409":
          description: Classroom is full
  /children/{id}:
    get:
      operationId: getChild
      tags: [children]
      summary: Get a child
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Child record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Child not found
    patch:
      operationId: updateChild
      tags: [children]
      summary: Update a child
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildUpdate"
      responses:
        "200":
          description: Updated child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Child or classroom not found
        "409":
          description: Classroom is full
    delete:
      operationId: deleteChild
      tags: [children]
      summary: Delete a child
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Child deleted
  /children/{id}/renewals:
    post:
      operationId: startChildRenewal
      tags: [applications]
      summary: Start a renewal application for a child
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Renewal application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Child not found
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List registration and renewal applications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, reviewing, accepted, rejected]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [new, renewal]
      responses:
        "200":
          description: Application records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create a registration application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid application data
        "404":
          description: Classroom not found
        "409":
          description: Classroom is full
  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application child and guardian data
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found
        "409":
          description: Accepted applications cannot be edited or classroom is full
  /applications/{id}/documents:
    post:
      operationId: attachApplicationDocument
      tags: [applications]
      summary: Attach uploaded document metadata to an application
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDocumentInput"
      responses:
        "201":
          description: Attached document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocument"
        "400":
          description: Invalid document metadata or object path
        "404":
          description: Application or uploaded object not found
        "409":
          description: Accepted applications cannot be edited
        "415":
          description: Unsupported document type
  /applications/{applicationId}/documents/{documentId}/content:
    get:
      operationId: getApplicationDocumentContent
      tags: [applications]
      summary: Download an application document
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: number
        - name: documentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Application document content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "404":
          description: Application document not found
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private object upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL and normalized object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          description: Unauthorized
        "400":
          description: Invalid upload metadata
        "404":
          description: Application not found
        "409":
          description: Accepted applications cannot be edited
        "415":
          description: Unsupported document type
  /applications/{id}/status:
    patch:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Move an application through review or reject it
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found
        "409":
          description: Illegal application status transition
  /applications/{id}/accept:
    post:
      operationId: acceptApplication
      tags: [applications]
      summary: Accept an application and activate its child record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Accepted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application or renewal child not found
        "409":
          description: Only reviewing applications can be accepted or classroom is full
  /guardians:
    get:
      operationId: listGuardians
      tags: [guardians]
      summary: List guardians
      responses:
        "200":
          description: Guardian records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guardian"
  /classrooms:
    get:
      operationId: listClassrooms
      tags: [classrooms]
      summary: List classrooms
      responses:
        "200":
          description: Classroom records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classroom"
    post:
      operationId: createClassroom
      tags: [classrooms]
      summary: Create a classroom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomInput"
      responses:
        "201":
          description: Created classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"
        "400":
          description: Invalid classroom data
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff
      responses:
        "200":
          description: Staff records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaff
      tags: [staff]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffInput" } } }
      responses:
        "201":
          description: Created staff member
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffMember" } } }
  /attendance/today:
    get:
      operationId: getTodayAttendance
      tags: [attendance]
      summary: Get today's child attendance
      responses:
        "200":
          description: Today's attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
  /attendance:
    post:
      operationId: recordAttendance
      tags: [attendance]
      summary: Record child attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Get finance summary
      responses:
        "200":
          description: Finance overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
  /invoices:
    get:
      operationId: listInvoices
      tags: [finance]
      summary: List recent invoices
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, issued, pending, partial, paid, overdue, cancelled]
      responses:
        "200":
          description: Invoice records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [finance]
      summary: Create a detailed internal invoice
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceInput" } } }
      responses:
        "201":
          description: Created invoice
          content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceDetail" } } }
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Detailed invoice
          content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceDetail" } } }
  /invoices/{id}/payments:
    post:
      operationId: recordInvoicePayment
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InternalPaymentInput" } } }
      responses:
        "201":
          description: Payment and receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/Receipt" } } }
  /invoices/{id}/refunds:
    post:
      operationId: refundInvoicePayment
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefundInput" } } }
      responses:
        "201":
          description: Recorded refund
          content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceRefund" } } }
  /invoices/{id}/cancel:
    post:
      operationId: cancelInvoice
      tags: [finance]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CancelInvoiceInput" } } }
      responses:
        "200": { description: Cancelled invoice, content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceDetail" } } } }
  /parent/documents:
    get:
      operationId: listParentDocuments
      tags: [parent]
      responses:
        "200":
          description: Parent-visible child documents
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ParentDocument" } } } }
  /parent/documents/{id}/content:
    get:
      operationId: getParentDocumentContent
      tags: [parent]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Private parent document content
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "404": { description: Document not found }
  /parent/receipts:
    get:
      operationId: listParentReceipts
      tags: [parent, finance]
      responses:
        "200":
          description: Guardian receipts
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Receipt" } } } }
  /exchange-rates/kwd-usd:
    get:
      operationId: getKwdUsdExchangeRate
      tags: [finance]
      summary: Get the current fresh KWD to USD exchange rate
      responses:
        "200":
          description: Current fresh exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
        "503":
          description: No fresh exchange rate is available
  /invoices/{id}/checkout-session:
    post:
      operationId: createInvoiceCheckoutSession
      tags: [finance]
      summary: Create a Stripe checkout session to pay an invoice
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCheckoutSessionInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCheckoutSession"
        "400":
          description: Invoice already paid
        "404":
          description: Invoice not found
  /invoices/{id}/cash-payment:
    post:
      operationId: recordCashInvoicePayment
      tags: [finance]
      summary: Record a full cash payment for an invoice
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashPaymentInput"
      responses:
        "200":
          description: Cash payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePaymentResult"
        "400":
          description: Invalid amount or invoice already paid
        "404":
          description: Invoice not found
        "409":
          description: Invoice was paid concurrently
  /invoices/{id}/reminder:
    post:
      operationId: sendInvoiceReminder
      tags: [finance]
      summary: Send a due-date payment reminder to the guardian
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Reminder dispatch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceReminderResult"
        "404":
          description: Invoice not found
  /parent/overview:
    get:
      operationId: getParentOverview
      tags: [parent]
      summary: Get the authenticated guardian's overview
      responses:
        "200":
          description: Parent overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentOverview"
        "401": { description: Authentication required }
        "403": { description: Parent access required }
  /session/context:
    get:
      operationId: getSessionContext
      tags: [parent]
      summary: Resolve the authenticated user's application role
      responses:
        "200":
          description: Application session context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContext"
        "401": { description: Authentication required }
  /parent/children:
    get:
      operationId: listParentChildren
      tags: [parent]
      summary: List children belonging to the authenticated guardian
      responses:
        "200":
          description: Guardian children
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentChild"
        "401": { description: Authentication required }
        "403": { description: Parent access required }
  /parent/attendance:
    get:
      operationId: listParentAttendance
      tags: [parent]
      summary: Get attendance history for guardian children
      parameters:
        - $ref: "#/components/parameters/OptionalChildId"
      responses:
        "200":
          description: Attendance history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "401": { description: Authentication required }
        "403": { description: Parent access required }
  /parent/progress-reports:
    get:
      operationId: listParentProgressReports
      tags: [parent]
      summary: Get progress reports for guardian children
      parameters:
        - $ref: "#/components/parameters/OptionalChildId"
      responses:
        "200":
          description: Progress reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressReport"
        "401": { description: Authentication required }
        "403": { description: Parent access required }
  /parent/activities:
    get:
      operationId: listParentActivities
      tags: [parent]
      summary: Get activities and photos for guardian children
      parameters:
        - $ref: "#/components/parameters/OptionalChildId"
      responses:
        "200":
          description: Child activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentChildActivity"
        "401": { description: Authentication required }
        "403": { description: Parent access required }
  /parent/invoices:
    get:
      operationId: listParentInvoices
      tags: [parent]
      summary: Get invoices belonging to the authenticated guardian
      responses:
        "200":
          description: Guardian invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
  /parent/invoices/{id}/checkout-session:
    post:
      operationId: createParentInvoiceCheckoutSession
      tags: [parent, finance]
      summary: Create a Stripe checkout session for a guardian invoice
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCheckoutSessionInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCheckoutSession"
        "400":
          description: Invoice already paid
        "404":
          description: Invoice not found
        "503":
          description: No fresh exchange rate is available
        "401": { description: Authentication required }
        "403": { description: Parent access required }
  /parent/messages:
    get:
      operationId: listParentMessages
      tags: [parent]
      summary: Get messages for the authenticated guardian
      responses:
        "200":
          description: Guardian messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentMessage"
        "401": { description: Authentication required }
        "403": { description: Parent access required }
    post:
      operationId: sendParentMessage
      tags: [parent]
      summary: Send a message to the nursery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentMessageInput"
      responses:
        "201":
          description: Persisted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentMessage"
        "400": { description: Invalid message }
        "401": { description: Authentication required }
        "403": { description: Parent access required }
  /parent/announcements:
    get:
      operationId: listParentAnnouncements
      tags: [parent]
      summary: Get announcements visible to parents
      responses:
        "200":
          description: Parent announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentAnnouncement"
        "401": { description: Authentication required }
        "403": { description: Parent access required }
  /children/{id}/records:
    get:
      operationId: listChildRecords
      tags: [operations]
      summary: List health, emergency, allergy, medication, document, photo, note, or history entries
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Child dossier records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChildRecord" }
        "404": { description: Child not found }
    post:
      operationId: createChildRecord
      tags: [operations]
      summary: Add an entry to a child dossier
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildRecordInput" }
      responses:
        "201":
          description: Created dossier entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildRecord" }
        "403": { description: Operation not permitted }
        "404": { description: Child not found }
  /children/{id}/contacts:
    get:
      operationId: listChildContacts
      tags: [children]
      summary: List owner-scoped guardians, emergency contacts, pickups, consents and invitations
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Child contacts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChildContact" } }
    post:
      operationId: createChildContact
      tags: [children]
      summary: Add a typed child family record
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildContactInput" }
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildContact" }
        "404": { description: Child not found }
  /attendance/history:
    get:
      operationId: listAttendanceHistory
      tags: [attendance]
      summary: List child attendance over a date range
      parameters:
        - { name: childId, in: query, schema: { type: number } }
        - { name: dateFrom, in: query, schema: { type: string } }
        - { name: dateTo, in: query, schema: { type: string } }
      responses:
        "200":
          description: Attendance history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AttendanceRecord" } }
  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [staff]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffInput" } } }
      responses:
        "200":
          description: Updated staff member
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffMember" } } }
    delete:
      operationId: deleteStaff
      tags: [staff]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
  /nursery/settings:
    get:
      operationId: getNurserySettings
      tags: [operations]
      responses:
        "200":
          description: Typed nursery settings
          content: { application/json: { schema: { $ref: "#/components/schemas/NurserySettings" } } }
    put:
      operationId: setNurserySettings
      tags: [operations]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NurserySettingsInput" } } }
      responses:
        "200":
          description: Updated settings
          content: { application/json: { schema: { $ref: "#/components/schemas/NurserySettings" } } }
  /staff-attendance:
    get:
      operationId: listStaffAttendance
      tags: [attendance]
      summary: List staff attendance with date and staff filters
      parameters:
        - { name: staffId, in: query, schema: { type: number } }
        - { name: dateFrom, in: query, schema: { type: string } }
        - { name: dateTo, in: query, schema: { type: string } }
      responses:
        "200":
          description: Staff attendance records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffAttendance" }
    post:
      operationId: recordStaffAttendance
      tags: [attendance]
      summary: Manually record attendance, lateness, or early departure for staff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffAttendanceInput" }
      responses:
        "201":
          description: Staff attendance record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAttendance" }
        "404": { description: Staff member not found }
  /operations/{resource}:
    get:
      operationId: listOperationalRecords
      tags: [operations]
      summary: List records for a nursery operational resource
      parameters:
        - $ref: "#/components/parameters/Resource"
      responses:
        "200":
          description: Operational records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationalRecord" }
    post:
      operationId: createOperationalRecord
      tags: [operations]
      summary: Create an operational record
      parameters:
        - $ref: "#/components/parameters/Resource"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalRecordInput" }
      responses:
        "201":
          description: Created operational record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRecord" }
        "403": { description: Operation not permitted }
  /operations/{resource}/{id}:
    patch:
      operationId: updateOperationalRecord
      tags: [operations]
      summary: Update an operational record
      parameters:
        - $ref: "#/components/parameters/Resource"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalRecordUpdate" }
      responses:
        "200":
          description: Updated operational record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRecord" }
        "404": { description: Record not found }
    delete:
      operationId: deleteOperationalRecord
      tags: [operations]
      summary: Delete an operational record
      parameters:
        - $ref: "#/components/parameters/Resource"
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
        "404": { description: Record not found }
  /reports:
    get:
      operationId: getNurseryReport
      tags: [reports]
      summary: Generate filtered operational, academic, or financial report
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string, enum: [operational, academic, financial] }
        - { name: branchId, in: query, schema: { type: number } }
        - { name: classroomId, in: query, schema: { type: number } }
        - { name: status, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string } }
        - { name: dateTo, in: query, schema: { type: string } }
      responses:
        "200":
          description: Filtered report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NurseryReport" }
  /permissions:
    get:
      operationId: listRolePermissions
      tags: [permissions]
      summary: List configured role permissions
      responses:
        "200":
          description: Role permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RolePermission" }
    put:
      operationId: setRolePermission
      tags: [permissions]
      summary: Set a role permission (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePermissionInput" }
      responses:
        "200":
          description: Updated role permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolePermission" }
        "403": { description: Owner access required }
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [permissions]
      summary: List owner-scoped sensitive-operation audit events
      parameters:
        - { name: operation, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
    OptionalChildId:
      name: childId
      in: query
      required: false
      schema:
        type: number
    Resource:
      name: resource
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OperationalResource" }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      required: [totalChildren, presentToday, absentToday, staffCount, monthlyRevenue, pendingPayments, attendanceRate]
      properties:
        totalChildren: { type: number }
        presentToday: { type: number }
        absentToday: { type: number }
        staffCount: { type: number }
        monthlyRevenue: { type: number }
        pendingPayments: { type: number }
        attendanceRate: { type: number }
    Activity:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: number }
        type:
          type: string
          enum: [attendance, payment, enrollment, message, note]
        title: { type: string }
        description: { type: string }
        createdAt: { type: string }
        actor: { type: ["string", "null"] }
    Child:
      type: object
      required: [id, firstName, lastName, fullName, gender, birthDate, status, classroomId, classroomName, guardianName, guardianPhone, level, attendanceRate]
      properties:
        id: { type: number }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        gender:
          type: string
          enum: [male, female]
        birthDate: { type: string }
        status:
          type: string
          enum: [active, pending, inactive]
        classroomId: { type: ["number", "null"] }
        classroomName: { type: ["string", "null"] }
        guardianName: { type: string }
        guardianPhone: { type: string }
        level: { type: string }
        attendanceRate: { type: number }
        avatarUrl: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    ChildInput:
      type: object
      required: [firstName, lastName, gender, birthDate, guardianName, guardianPhone, level]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        gender:
          type: string
          enum: [male, female]
        birthDate: { type: string }
        classroomId: { type: ["number", "null"] }
        guardianName: { type: string, minLength: 1 }
        guardianPhone: { type: string, minLength: 5 }
        level: { type: string, minLength: 1 }
        notes: { type: ["string", "null"] }
    ChildUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        gender:
          type: string
          enum: [male, female]
        birthDate: { type: string }
        classroomId: { type: ["number", "null"] }
        guardianName: { type: string, minLength: 1 }
        guardianPhone: { type: string, minLength: 5 }
        level: { type: string, minLength: 1 }
        status:
          type: string
          enum: [active, pending, inactive]
        notes: { type: ["string", "null"] }
    Application:
      type: object
      required: [id, type, status, childId, sourceChildId, firstName, lastName, gender, birthDate, level, classroomId, notes, guardianName, guardianPhone, guardianEmail, documents, createdAt, updatedAt]
      properties:
        id: { type: number }
        type:
          type: string
          enum: [new, renewal]
        status:
          type: string
          enum: [new, reviewing, accepted, rejected]
        childId: { type: ["number", "null"] }
        sourceChildId: { type: ["number", "null"] }
        firstName: { type: string }
        lastName: { type: string }
        gender:
          type: string
          enum: [male, female]
        birthDate: { type: string }
        level: { type: string }
        classroomId: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
        guardianName: { type: string }
        guardianPhone: { type: string }
        guardianEmail: { type: ["string", "null"] }
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDocument"
        createdAt: { type: string }
        updatedAt: { type: string }
    ApplicationInput:
      type: object
      required: [firstName, lastName, gender, birthDate, level, guardianName, guardianPhone]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        gender:
          type: string
          enum: [male, female]
        birthDate: { type: string }
        level: { type: string, minLength: 1 }
        classroomId: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
        guardianName: { type: string, minLength: 1 }
        guardianPhone: { type: string, minLength: 5 }
        guardianEmail: { type: ["string", "null"] }
    ApplicationUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        gender:
          type: string
          enum: [male, female]
        birthDate: { type: string }
        level: { type: string, minLength: 1 }
        classroomId: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
        guardianName: { type: string, minLength: 1 }
        guardianPhone: { type: string, minLength: 5 }
        guardianEmail: { type: ["string", "null"] }
    ApplicationDocument:
      type: object
      required: [id, applicationId, name, contentType, size, objectPath, createdAt]
      properties:
        id: { type: number }
        applicationId: { type: number }
        name: { type: string }
        contentType: { type: string }
        size: { type: number }
        objectPath:
          type: string
          pattern: "^/objects/uploads/[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$"
        createdAt: { type: string }
    ApplicationDocumentInput:
      type: object
      required: [name, contentType, size, objectPath]
      properties:
        name: { type: string, minLength: 1 }
        contentType: { type: string, minLength: 1 }
        size: { type: number, minimum: 1, maximum: 10485760, multipleOf: 1 }
        objectPath:
          type: string
          pattern: "^/objects/uploads/[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$"
    ParentDocument:
      type: object
      required: [id, applicationId, childId, name, contentType, size, createdAt]
      properties:
        id: { type: number }
        applicationId: { type: number }
        childId: { type: number }
        name: { type: string }
        contentType: { type: string }
        size: { type: number }
        createdAt: { type: string }
    UploadUrlRequest:
      type: object
      required: [applicationId, name, size, contentType]
      properties:
        applicationId: { type: number, minimum: 1, multipleOf: 1 }
        name: { type: string, minLength: 1 }
        size: { type: number, minimum: 1, maximum: 10485760, multipleOf: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string }
        objectPath:
          type: string
          pattern: "^/objects/uploads/[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$"
    ApplicationStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, reviewing, rejected]
    Guardian:
      type: object
      required: [id, name, phone, email, childrenCount, balance]
      properties:
        id: { type: number }
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        childrenCount: { type: number }
        balance: { type: number }
    Classroom:
      type: object
      required: [id, name, level, teacherName, capacity, childrenCount, color]
      properties:
        id: { type: number }
        name: { type: string }
        level: { type: string }
        teacherName: { type: string }
        capacity: { type: number }
        childrenCount: { type: number }
        color: { type: string }
        branchId: { type: ["number", "null"] }
        stageId: { type: ["number", "null"] }
        schedule: { type: object, additionalProperties: true }
    ClassroomInput:
      type: object
      required: [name, level, teacherName, capacity]
      properties:
        name: { type: string, minLength: 1 }
        level: { type: string, minLength: 1 }
        teacherName: { type: string, minLength: 1 }
        capacity: { type: number, minimum: 1, multipleOf: 1 }
        color: { type: string, minLength: 1 }
        branchId: { type: ["number", "null"] }
        stageId: { type: ["number", "null"] }
        schedule: { type: object, additionalProperties: true }
    StaffMember:
      type: object
      required: [id, name, role, phone, status, attendanceRate]
      properties:
        id: { type: number }
        name: { type: string }
        role: { type: string }
        phone: { type: string }
        status:
          type: string
          enum: [present, absent, leave]
        attendanceRate: { type: number }
        avatarUrl: { type: ["string", "null"] }
    StaffInput:
      type: object
      required: [name, role, phone, status]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }
        phone: { type: string, minLength: 5 }
        status: { type: string, enum: [present, absent, leave] }
        email: { type: ["string", "null"] }
        jobTitle: { type: ["string", "null"] }
        hireDate: { type: ["string", "null"] }
    AttendanceRecord:
      type: object
      required: [id, childId, childName, date, status, checkIn, checkOut, source]
      properties:
        id: { type: number }
        childId: { type: number }
        childName: { type: string }
        date: { type: string }
        status:
          type: string
          enum: [present, absent, late, excused]
        checkIn: { type: ["string", "null"] }
        checkOut: { type: ["string", "null"] }
        departureType: { type: ["string", "null"], enum: [normal, early, null] }
        source: { type: string, enum: [manual, device, import] }
        recordedBy: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        pickupName: { type: ["string", "null"] }
        pickupIdentity: { type: ["string", "null"] }
        correctedAt: { type: ["string", "null"] }
        correctionReason: { type: ["string", "null"] }
        pickupOverride: { type: boolean, default: false }
        pickupOverrideReason: { type: ["string", "null"] }
    AttendanceInput:
      type: object
      required: [childId, date, status]
      properties:
        childId: { type: number }
        date: { type: string }
        status:
          type: string
          enum: [present, absent, late, excused]
        checkIn: { type: ["string", "null"] }
        checkOut: { type: ["string", "null"] }
        departureType: { type: ["string", "null"], enum: [normal, early, null] }
        source: { type: string, enum: [manual, device, import], default: manual }
        note: { type: ["string", "null"] }
        pickupName: { type: ["string", "null"] }
        pickupIdentity: { type: ["string", "null"] }
        correctionReason: { type: ["string", "null"] }
        pickupOverride: { type: boolean, default: false }
        pickupOverrideReason: { type: ["string", "null"] }
    FinanceSummary:
      type: object
      required: [collectedThisMonth, outstanding, overdueCount, paidCount, monthlyTrend]
      properties:
        collectedThisMonth: { type: number }
        outstanding: { type: number }
        overdueCount: { type: number }
        paidCount: { type: number }
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/FinanceMonth"
    FinanceMonth:
      type: object
      required: [month, collected, expected]
      properties:
        month: { type: string }
        collected: { type: number }
        expected: { type: number }
    Invoice:
      type: object
      required: [id, invoiceNumber, guardianName, childName, amount, dueDate, status, paidAt, lastPaymentStatus]
      properties:
        id: { type: number }
        invoiceNumber: { type: string }
        guardianName: { type: string }
        childName: { type: string }
        amount: { type: number }
        dueDate: { type: string }
        status:
          type: string
          enum: [draft, issued, pending, partial, paid, overdue, cancelled]
        paidAt: { type: ["string", "null"] }
        lastPaymentStatus: { type: ["string", "null"] }
        lastPaymentError: { type: ["string", "null"] }
        chargedCurrency: { type: ["string", "null"] }
        chargedAmount: { type: ["number", "null"] }
        paymentMethod:
          type: ["string", "null"]
          enum: [payment_link, knet, cash, bank_transfer, cheque, card_terminal, null]
        paymentReference: { type: ["string", "null"] }
    InvoiceLine:
      type: object
      required: [id, type, description, quantity, unitAmount, amount]
      properties:
        id: { type: number }
        type: { type: string, enum: [fee, discount, addon] }
        description: { type: string }
        quantity: { type: number }
        unitAmount: { type: number }
        amount: { type: number }
    InvoiceLineInput:
      type: object
      required: [type, description, quantity, unitAmount]
      properties:
        type: { type: string, enum: [fee, discount, addon] }
        description: { type: string, minLength: 1 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unitAmount: { type: number, minimum: 0 }
    InvoiceInput:
      type: object
      required: [childId, dueDate, lines]
      properties:
        childId: { type: number }
        dueDate: { type: string }
        status: { type: string, enum: [draft, issued], default: draft }
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/InvoiceLineInput" } }
    InvoiceDetail:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          required: [lines, paidAmount, refundedAmount, balance]
          properties:
            lines: { type: array, items: { $ref: "#/components/schemas/InvoiceLine" } }
            paidAmount: { type: number }
            refundedAmount: { type: number }
            balance: { type: number }
    InternalPaymentInput:
      type: object
      required: [method, amount]
      properties:
        method: { type: string, enum: [cash, bank_transfer, cheque, card_terminal] }
        amount: { type: number, exclusiveMinimum: 0 }
        reference: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
    RefundInput:
      type: object
      required: [amount, reason]
      properties:
        paymentId: { type: ["number", "null"] }
        amount: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, minLength: 1 }
    InvoiceRefund:
      type: object
      required: [id, invoiceId, amount, reason, recordedBy, createdAt]
      properties:
        id: { type: number }
        invoiceId: { type: number }
        paymentId: { type: ["number", "null"] }
        amount: { type: number }
        reason: { type: string }
        recordedBy: { type: string }
        createdAt: { type: string }
    CancelInvoiceInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    Receipt:
      type: object
      required: [id, invoiceId, paymentId, receiptNumber, amount, issuedBy, issuedAt]
      properties:
        id: { type: number }
        invoiceId: { type: number }
        paymentId: { type: number }
        receiptNumber: { type: string }
        amount: { type: number }
        issuedBy: { type: string }
        issuedAt: { type: string }
    CashPaymentInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001
        note:
          type: ["string", "null"]
          maxLength: 500
    InvoicePaymentResult:
      type: object
      required: [invoiceId, status, method, amount, currency, paidAt]
      properties:
        invoiceId: { type: number }
        status:
          type: string
          enum: [paid]
        method:
          type: string
          enum: [cash]
        amount: { type: number }
        currency:
          type: string
          enum: [KWD]
        reference: { type: ["string", "null"] }
        paidAt:
          type: string
          format: date-time
    InvoiceCheckoutSessionInput:
      type: object
      required: [returnUrl]
      properties:
        returnUrl:
          type: string
          description: Absolute URL of the finance page to redirect back to after checkout.
    InvoiceCheckoutSession:
      type: object
      required: [url]
      properties:
        url: { type: string }
    ExchangeRate:
      type: object
      required: [baseCurrency, quoteCurrency, rate, updatedAt]
      properties:
        baseCurrency:
          type: string
          enum: [KWD]
        quoteCurrency:
          type: string
          enum: [USD]
        rate:
          type: number
          exclusiveMinimum: 0
        updatedAt:
          type: string
          format: date-time
    InvoiceReminderResult:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [sent, failed]
        message: { type: string }
    ParentChild:
      type: object
      required: [id, firstName, lastName, fullName, birthDate, level, classroomName, attendanceRate]
      properties:
        id: { type: number }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        birthDate: { type: string }
        level: { type: string }
        classroomName: { type: ["string", "null"] }
        attendanceRate: { type: number }
        avatarUrl: { type: ["string", "null"] }
    ParentOverview:
      type: object
      required: [guardianId, guardianName, children, outstandingBalance, unreadMessages, announcementsCount]
      properties:
        guardianId: { type: number }
        guardianName: { type: string }
        children:
          type: array
          items:
            $ref: "#/components/schemas/ParentChild"
        outstandingBalance: { type: number }
        unreadMessages: { type: number }
        announcementsCount: { type: number }
    SessionContext:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [parent, admin, pending]
    ProgressReport:
      type: object
      required: [id, childId, childName, title, summary, period, educatorName, publishedAt]
      properties:
        id: { type: number }
        childId: { type: number }
        childName: { type: string }
        title: { type: string }
        summary: { type: string }
        period: { type: string }
        educatorName: { type: string }
        publishedAt: { type: string }
